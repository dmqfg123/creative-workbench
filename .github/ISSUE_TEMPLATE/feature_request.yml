name: 功能建议
description: 想要某个能力
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在写什么、卡在哪一步、现在怎么绕过去。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
